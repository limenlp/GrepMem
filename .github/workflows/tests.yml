name: CPU tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install evaluation dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps "rllm @ git+https://github.com/rllm-org/rllm.git@4e828c81680e5a85b638ceedeaf09d1e90109ca8"
      - name: Check code
        run: |
          ruff check .
          ruff format --check .
          for script in scripts/*.sh; do bash -n "$script"; done
          python -m pytest
